name: Fetch Tools (staging)

# 后台「获取新工具」按钮的落点。
#
# 只在 GitHub 的机器上跑现有 Node/Playwright 抓取逻辑，结果写进
# content/tools-staging.json 等待人工审核，**不直接改** content/aitools.json，
# 因此不会触发站点重新构建，线上不会有任何变化。
#
# 需要的仓库 Secrets：
#   PH_TOKEN        Product Hunt GraphQL token（本地 .env.local 里的同名变量）
#   APIFY_TOKEN     选填；不配则跳过 Similarweb 流量富化
#
on:
  workflow_dispatch:
    inputs:
      count:
        description: "抓取数量（1-200）"
        required: false
        default: "60"
      order:
        description: "Product Hunt 排序（newest 会抓到 1 票上下/无票的新品，判定端必然拒收，不建议）"
        type: choice
        options: [votes, newest]
        default: votes
      topic:
        description: "Product Hunt topic"
        required: false
        default: "artificial-intelligence"
      days:
        description: "Product Hunt 时间窗（天）：只抓最近 N 天发布的产品"
        required: false
        default: "30"
      enrich:
        description: "补 Similarweb 流量（成本近乎为 0）"
        type: boolean
        default: true
      job_id:
        description: "后台任务 ID（仅回显，便于对日志）"
        required: false
        default: ""

concurrency:
  group: fetch-tools
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # PH 的 website 字段是 /r/ 跳转，被 Cloudflare 防护挡服务端请求，
      # 只能靠有头 Chrome 解析真实域名；runner 已预装 Chrome，这里补系统依赖 + xvfb。
      - name: 准备浏览器
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: 抓取新工具（写入 D1 候选池）
        id: fetch
        env:
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # 候选池只写 D1；写不进去这一步直接失败，不会再退化成「写文件成功」
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          xvfb-run -a pnpm tsx scripts/admin/fetch-staging.ts \
            --count "${{ inputs.count }}" \
            --order "${{ inputs.order }}" \
            --topic "${{ inputs.topic }}" \
            --days "${{ inputs.days }}" \
            ${{ inputs.enrich && '--enrich' || '--no-enrich' }}

      - name: 刷新概览快照
        env:
          # 统计快照写库，后台概览不再读仓库文件
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm tsx scripts/admin/tool-stats.ts

      # 候选池在 D1，仓库里不再有队列文件；只有真的抓到新条目才提交快照
      - name: 提交概览快照
        if: steps.fetch.outputs.added != '0'
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          git add content/tools-stats.json
          if git diff --cached --quiet; then
            echo "::notice::概览快照无变化，未产生提交"
            exit 0
          fi
          git commit -m "chore(tools): 概览快照（候选池 +${{ steps.fetch.outputs.added }}）"
          git push