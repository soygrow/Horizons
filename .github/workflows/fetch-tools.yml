name: Fetch Tools (staging)

# 后台「获取新工具」按钮的落点。
#
# 只在 GitHub 的机器上跑现有 Node/Playwright 抓取逻辑，结果写进
# content/tools-staging.json 等待人工审核，**不直接改** content/aitools.json，
# 因此不会触发站点重新构建，线上不会有任何变化。
#
# 需要的仓库 Secrets：
#   PH_TOKEN        Product Hunt GraphQL token（本地 .env.local 里的同名变量）
#   APIFY_TOKEN     选填；不配则跳过 Similarweb 流量富化
#
on:
  workflow_dispatch:
    inputs:
      count:
        description: "抓取数量（1-200）"
        required: false
        default: "60"
      order:
        description: "Product Hunt 排序（newest 会抓到 1 票上下/无票的新品，判定端必然拒收，不建议）"
        type: choice
        options: [votes, newest]
        default: votes
      topic:
        description: "Product Hunt topic"
        required: false
        default: "artificial-intelligence"
      days:
        description: "Product Hunt 时间窗（天）：只抓最近 N 天发布的产品"
        required: false
        default: "30"
      enrich:
        description: "补 Similarweb 流量（成本近乎为 0）"
        type: boolean
        default: true
      domains:
        description: "指定网站（可选）：逗号分隔的域名或 URL，最多 50 个；填了就忽略上面的数量/排序/topic/days"
        required: false
        default: ""
      job_id:
        description: "后台任务 ID（仅回显，便于对日志）"
        required: false
        default: ""

# GitHub 默认同一 group 只留 1 个 pending：连点两次采集，排队中的那次会被顶成
# cancelled（日志：Canceling since a higher priority waiting request for fetch-tools
# exists，跑 14 秒就没了）。后台连点两次就是想抓两批，不能让第二批吃掉第一批。
# queue: max 允许 100 个 pending 按 FIFO 依次跑，两次都能完整执行。
concurrency:
  group: fetch-tools
  queue: max

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    steps:
      # fetch-depth: 0 —— 推送被拒时要 rebase 到远端最新提交，
      # shallow clone 缺共同祖先会直接 rebase 失败，重试就形同虚设。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # PH 的 website 字段是 /r/ 跳转，被 Cloudflare 防护挡服务端请求，
      # 只能靠有头 Chrome 解析真实域名；runner 已预装 Chrome，这里补系统依赖 + xvfb。
      - name: 准备浏览器
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: 抓取新工具（写入 D1 候选池）
        id: fetch
        env:
          PH_TOKEN: ${{ secrets.PH_TOKEN }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # 入库前把英文 tagline 翻成中文：后台列表直接展示 description，
          # 不翻的话人工审核看到的是英文；富化阶段才产中文，中间这段太长。
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 候选池只写 D1；写不进去这一步直接失败，不会再退化成「写文件成功」
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # 走 env 而不是直接拼进命令行：这是人填的自由文本，
          # 直接插值会被 shell 当成语法执行
          MANUAL_DOMAINS: ${{ inputs.domains }}
        run: |
          EXTRA=()
          if [ -n "$MANUAL_DOMAINS" ]; then
            EXTRA+=(--domains "$MANUAL_DOMAINS")
          fi
          xvfb-run -a pnpm tsx scripts/admin/fetch-staging.ts \
            --count "${{ inputs.count }}" \
            --order "${{ inputs.order }}" \
            --topic "${{ inputs.topic }}" \
            --days "${{ inputs.days }}" \
            ${{ inputs.enrich && '--enrich' || '--no-enrich' }} \
            "${EXTRA[@]}"

      # 兜底：抓取那一步的翻译是逐批请求，某一批失败就留英文；
      # 历史上没经过翻译入库的老条目也在这里补齐。已是中文的条目会被直接跳过。
      - name: 补齐候选池中文描述
        if: steps.fetch.outputs.added != '0'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm tsx scripts/admin/translate-staging.ts

      - name: 刷新概览快照
        env:
          # 统计快照写库，后台概览不再读仓库文件
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm tsx scripts/admin/tool-stats.ts

      # 候选池在 D1，仓库里不再有队列文件；只有真的抓到新条目才提交快照。
      #
      # 推送被拒是常态而非异常：抓取要跑十几分钟，这期间另一批采集 / daily /
      # 人工推送都可能抢先推进 main。以前是裸 git push，被拒就整步红叉
      # （2026-11-24 两次采集撞在一起就是这样：候选池明明已写进 D1，任务却显示失败）。
      # 快照是从 D1 全量重算的派生文件，重试即可、不该让任务失败 —— 重试逻辑
      # 统一在 .github/actions/push-content，soft-fail 保持只告警不红叉。
      - name: 提交概览快照
        if: steps.fetch.outputs.added != '0'
        uses: ./.github/actions/push-content
        with:
          paths: content/tools-stats.json
          message: "chore(tools): 概览快照（候选池 +${{ steps.fetch.outputs.added }}）"
          soft-fail: "true"