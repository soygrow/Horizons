name: Deploy Site

# push 到 main 后，在 GitHub 的机器上构建并直接部署到 Cloudflare，
# 不再经过本地网络上传（本地到 Cloudflare 边缘不稳定，上传慢且容易中断）。
#
# 需要的仓库 Secrets：
#   CLOUDFLARE_API_TOKEN   （权限见 docs/11-部署手册.md）
#   CLOUDFLARE_ACCOUNT_ID
on:
  push:
    branches: [main]
    paths:
      - "content/**"
      # 候选池与采集统计只给后台看，不参与页面生成。不排除的话，每点一次
      # 「采集」都会白跑一次整站构建（20 分钟）——而它一个字都不会改到页面上。
      - "!content/*-staging.json"
      - "!content/*-stats.json"
      - "!content/*-skipped.json"
      - "apps/site/**"
      - "packages/shared/**"
      - "scripts/build/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 整站构建约 20 分钟，再留出部署重试的余量（3 次 + 两次 30s 等待）
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 生成榜单产物 content/dist
        run: pnpm --filter @horizons/site run data

      - name: 构建 Astro 静态站
        run: pnpm --filter @horizons/site run build

      # 阻塞式断言：频道页缺失 / 数据塌成 0 条 / sitemap 与非白名单混入 / noindex 策略被改坏，
      # 一律在发布前失败，不把半成品推到线上。
      - name: 构建产物断言（阻塞）
        run: node scripts/check/site-artifacts.mjs

      # Cloudflare 的 versions 接口会偶发返回 code 10013（未分类瞬时错误）：
      # assets 已经全部上传成功，只卡在最后创建 Worker version 这一步，重试即过。
      # 不重试的话，一次抖动就要人工重跑整条 20 分钟的流水线。
      - name: 部署到 Cloudflare（horizons-site）
        run: |
          for attempt in 1 2 3; do
            echo "第 ${attempt}/3 次尝试部署…"
            if pnpm --filter @horizons/site exec wrangler deploy; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "部署失败，30 秒后重试"
              sleep 30
            fi
          done
          echo "连续 3 次部署失败：请确认 Cloudflare 状态页，以及 CLOUDFLARE_API_TOKEN 是否仍有 Workers Scripts:Edit 权限"
          exit 1

      # 部署已经成功，验收只用于暴露问题：失败不阻塞流水线，
      # 避免网络抖动把一次成功发布标成失败。
      - name: 线上验收（非阻塞）
        continue-on-error: true
        run: |
          fail=0
          for path in / /tools /github /trends /daily /models /opportunity /sitemap.xml /robots.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --max-time 10 --retry 2 --retry-delay 2 --retry-all-errors \
              "https://horizons.tools$path" || true)
            echo "$path → ${code:-000}"
            [ "${code:-000}" = "200" ] || fail=1
          done
          exit "$fail"