name: Publish Tools

# 后台「更新榜单」按钮的落点：把 D1 工作区里已富化的条目合并进 D1 榜单快照
# （新版本，最后切指针生效），然后显式触发 Deploy Site。
#
# 第二期起 content/aitools.json 不入库（.gitignore）：榜单唯一真源是 D1，
# 站点构建时由 scripts/admin/hydrate-tools.ts 从当前版本还原。所以
# 「有没有变更」不能再看 git diff，改由发布脚本的 --report 报告判定。
#
# 需要的仓库 Secrets：
#   ADMIN_BOT_TOKEN  选填；PAT（contents:write + actions:write）。配了才能自动构建上线；
#                    不配则用默认 GITHUB_TOKEN 提交，构建需要手动点 Deploy Site。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "发布说明（后台记录用）"
        required: false
        default: ""
      domains:
        description: "只发布这些域名（逗号分隔；留空=发布全部已富化条目）"
        required: false
        default: ""
      drops:
        description: "同时执行下榜清单（1=是，0=否；清单来自重判存量）"
        required: false
        default: "1"
      kind:
        description: "发布来源：new=新条目（追加）/ refresh=线上更新（覆盖同域名）"
        required: false
        default: "new"
      patch:
        description: "1 = 增量（默认）：只在当前版本上改变化的行；0 = 全量：新建完整版本快照"
        required: false
        default: "1"
      job_id:
        description: "后台任务 ID（仅回显）"
        required: false
        default: ""

concurrency:
  group: publish-tools
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      # fetch-depth: 0 —— 统计快照的推送被拒时要 rebase 到远端最新提交，
      # shallow clone 缺共同祖先会直接 rebase 失败，重试就形同虚设。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 合并已富化队列
        env:
          # D1 冷备写入：灰度期失败不阻塞 JSON 发布
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          ARGS="--kind ${{ inputs.kind }} --report content/tools-publish.json"
          if [ -n "${{ inputs.domains }}" ]; then ARGS="$ARGS --domains ${{ inputs.domains }}"; fi
          if [ "${{ inputs.drops }}" = "1" ]; then ARGS="$ARGS --drops"; fi
          # 默认增量（只写变化的行）；显式传 patch=0 才走完整发布
          if [ "${{ inputs.patch }}" = "0" ]; then ARGS="$ARGS --full"; fi
          pnpm tsx scripts/admin/publish-tools.ts $ARGS

      - name: 提交统计快照
        id: commit
        env:
          # tool-stats 会把统计快照写进 D1，后台概览读库
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          # 榜单文件已变，统计快照必须跟着重建，否则后台概览会停在旧数字
          pnpm exec tsx scripts/admin/tool-stats.ts
          pnpm exec tsx scripts/admin/board-stats.ts
          # 榜单数据不再入库（唯一真源是 D1），这里只提交统计快照。
          # 候选池也早已迁到 D1，仓库里没有 tools-staging.json。
          git add content/tools-stats.json content/board-stats.json
          if git diff --cached --quiet; then
            echo "::notice::统计快照无变化"
          else
            msg="${{ inputs.note }}"
            git commit -m "chore(tools): 刷新榜单统计${msg:+（${msg}）}"

            # 发布前后要跑几分钟，期间另一批采集 / 审计 / 人工推送都可能推进 main。
            # 快照是从 D1 重算的派生文件，rebase 重试即可 —— 被拒不该让整次发布
            # 在最后一步红叉，那时榜单其实已经写进 D1 了。
            REF="${GITHUB_REF_NAME:-main}"
            pushed=0
            for i in 1 2 3; do
              if git push origin "HEAD:${REF}"; then
                pushed=1
                break
              fi
              echo "::warning::push 被拒（第 ${i} 次），同步远端后重试"
              git fetch --quiet origin "${REF}"
              if ! GIT_EDITOR=true git rebase "origin/${REF}"; then
                # 快照以本次这份为准
                git checkout --theirs -- content/tools-stats.json content/board-stats.json || true
                git add content/tools-stats.json content/board-stats.json
                GIT_EDITOR=true git rebase --continue || git rebase --abort
              fi
              sleep $((i * 5))
            done
            if [ "$pushed" = "0" ]; then
              echo "::warning::连续 3 次推送失败，统计快照未入仓；榜单数据在 D1 里，下次任务会重算"
            fi
          fi
          # 是否要重建站点只看发布报告：git diff 只反映统计文件，与榜单是否真的变了无关
          changed=$(node -e 'const r=require("./content/tools-publish.json");const n=(r.added||0)+(r.updated||0)+(r.dropped||0);process.stdout.write(n>0?"true":"false")')
          echo "榜单变更：${changed}（详见 content/tools-publish.json）"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"

      # 导出 R2 快照：构建读对象存储，不再从 D1 全量还原
      - name: 导出榜单快照
        if: steps.commit.outputs.changed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm exec tsx scripts/admin/hydrate-tools.ts --upload-snapshot

      # GITHUB_TOKEN 提交不会触发 push 型 workflow，这里显式触发部署；
      # 配了 ADMIN_BOT_TOKEN 时用它，保证 dispatch 生效。
      - name: 触发站点构建
        if: steps.commit.outputs.changed == 'true'
        env:
          BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-site.yml/dispatches" \
            -d '{"ref":"main"}' | head -c 400
          echo
          echo "::notice::已请求 Deploy Site（若未自动开始，请检查 ADMIN_BOT_TOKEN 权限）"