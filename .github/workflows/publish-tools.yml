name: Publish Tools

# 后台「更新榜单」按钮的落点：把 content/tools-staging.json 合并进 content/aitools.json，
# 然后显式触发 Deploy Site（用默认 GITHUB_TOKEN 提交时，push 事件不会触发其它 workflow，
# 所以这里必须显式 dispatch 一次）。
#
# 需要的仓库 Secrets：
#   ADMIN_BOT_TOKEN  选填；PAT（contents:write + actions:write）。配了才能自动构建上线；
#                    不配则用默认 GITHUB_TOKEN 提交，构建需要手动点 Deploy Site。

on:
  workflow_dispatch:
    inputs:
      note:
        description: "发布说明（后台记录用）"
        required: false
        default: ""
      domains:
        description: "只发布这些域名（逗号分隔；留空=发布全部已富化条目）"
        required: false
        default: ""
      drops:
        description: "同时执行下榜清单（1=是，0=否；清单来自重判存量）"
        required: false
        default: "1"
      job_id:
        description: "后台任务 ID（仅回显）"
        required: false
        default: ""

concurrency:
  group: publish-tools
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 合并已富化队列
        env:
          # D1 冷备写入：灰度期失败不阻塞 JSON 发布
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.domains }}" ]; then ARGS="$ARGS --domains ${{ inputs.domains }}"; fi
          if [ "${{ inputs.drops }}" = "1" ]; then ARGS="$ARGS --drops"; fi
          pnpm tsx scripts/admin/publish-tools.ts $ARGS

      - name: 提交榜单数据
        id: commit
        env:
          # tool-stats 会把统计快照写进 D1，后台概览读库
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          # 榜单文件已变，统计快照必须跟着重建，否则后台概览会停在旧数字
          pnpm exec tsx scripts/admin/tool-stats.ts
          pnpm exec tsx scripts/admin/board-stats.ts
          git add content/aitools.json content/tools-staging.json content/tools-stats.json content/board-stats.json
          if git diff --cached --quiet; then
            echo "::notice::没有可发布的条目，未产生提交"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          msg="${{ inputs.note }}"
          git commit -m "feat(tools): 发布新工具到榜单${msg:+（${msg}）}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 提交不会触发 push 型 workflow，这里显式触发部署；
      # 配了 ADMIN_BOT_TOKEN 时用它，保证 dispatch 生效。
      - name: 触发站点构建
        if: steps.commit.outputs.changed == 'true'
        env:
          BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-site.yml/dispatches" \
            -d '{"ref":"main"}' | head -c 400
          echo
          echo "::notice::已请求 Deploy Site（若未自动开始，请检查 ADMIN_BOT_TOKEN 权限）"