name: Enrich Tools (staging)

# 后台「开始富化」按钮的落点。
# 只处理 stage=approved（人工已确认收录）的候选，补流量/渠道/AI 引荐/SERP
# 与 LLM 解读，然后生成 content/tools-field-report.json 供后台看完整度。
# 只写 D1 工作区（board_items），不动榜单快照，所以不会影响线上页面。
# 榜单数据已不入库：content/aitools.json 由构建时从 D1 还原，只有
# publish-tools 发布新版本后才需要重建站点。
#
# 需要的仓库 Secrets：
#   APIFY_TOKEN             vortex（准入已付费，富化命中 collect_raw 为 $0）+ SERP
#   DEEPSEEK_API_KEY        AI 解读
# 配不全时可用「仅免费字段」模式（free_only=true）跳过付费项。
#
# DataForSEO 已于 2026-11 下线：它给的「搜索流量」与页面展示的「总访问量」
# 不是同一口径，且同一域名准入阶段已买过 vortex，再买一次只是重复付费。

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "只富化这些域名（逗号分隔；留空=全部已确认收录）"
        required: false
        default: ""
      limit:
        description: "本次最多处理多少条（1-15；单站实测 3~4 分钟，脚本并发 3 跑，timeout 60 分钟）"
        required: false
        default: "10"
      kind:
        description: "来源：new=新条目 / refresh=线上更新（两个后台 tab 的分界线）"
        required: false
        default: "new"
      force:
        description: "强制重采（绕过 field-collect 的一个月缓存）"
        type: boolean
        default: false
      no_llm:
        description: "只采集、不重跑文案（三段 LLM 全跳过）"
        type: boolean
        default: false
      insight_only:
        description: "只重跑文案、不采集（跳过 Playwright/vortex/apify）"
        type: boolean
        default: false
      free_only:
        description: "仅免费字段（跳过付费采集与 LLM）"
        type: boolean
        default: false
      job_id:
        description: "后台任务 ID（仅回显，便于对日志）"
        required: false
        default: ""

# GitHub 默认同一 concurrency group 只允许 1 个 pending：新 run 进来会把之前
# 那个 pending 顶成 cancelled。后台提交 50 条会被前端拆成 4 批连发，于是第 3 批
# 顶掉第 2 批、第 4 批顶掉第 3 批 —— 表现就是「4 条里 2 条立刻失败，只剩第一条
# 和最后一条在跑」，中间两批的条目根本没被处理。
#
# queue: max 允许最多 100 个 pending 按 FIFO 依次执行（与 cancel-in-progress: true
# 互斥，这里本来也不需要取消正在跑的 job）。
concurrency:
  group: enrich-tools
  queue: max

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 —— 推被拒时要 rebase 到远端最新提交，shallow clone 缺共同
      # 祖先会直接 rebase 失败，那样「重试」形同虚设。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 准备浏览器
        run: |
          pnpm exec playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: 富化已确认候选
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 富化状态与字段体检报告写库（后台只读库）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          # 同时跑几个站：单站 3~4 分钟几乎全在等 Playwright / vortex / DeepSeek，
          # 串行跑 60 分钟只够 17 条（后台提交 30 条因此被超时掐掉）。
          # 3 是保守值（3 个 Chromium + 3 个 Apify run）；机器和配额扛得住可调到 4~5。
          ENRICH_CONCURRENCY: "3"
          # 时间预算：留 10 分钟给收尾（D1 写入 + commit + 触发构建），
          # 到点不再开新站，没跑到的退回「已确认收录」，不会被 Actions 硬杀。
          ENRICH_BUDGET_MINUTES: "45"
        run: |
          # 线上更新：先把榜单快照回填成工作区条目（kind=refresh），
          # 之后走的是和新条目完全相同的富化链路，采集口径不会分叉。
          if [ "${{ inputs.kind }}" = "refresh" ]; then
            pnpm tsx scripts/admin/refresh-prepare.ts --domains "${{ inputs.domains }}"
          fi

          ARGS="--limit ${{ inputs.limit }} --kind ${{ inputs.kind }}"
          if [ -n "${{ inputs.domains }}" ]; then ARGS="$ARGS --domains ${{ inputs.domains }}"; fi
          if [ "${{ inputs.free_only }}" = "true" ]; then ARGS="$ARGS --free-only"; fi
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ "${{ inputs.no_llm }}" = "true" ]; then ARGS="$ARGS --no-llm"; fi
          if [ "${{ inputs.insight_only }}" = "true" ]; then ARGS="$ARGS --insight-only"; fi
          pnpm tsx scripts/admin/enrich-staging.ts $ARGS

      # 推送被拒是常态而不是异常：daily / collect-fields / 另一批富化 / 人工推送
      # 都可能在这 40 分钟里抢先推一版。以前这里是裸 `git push`，被拒就整步失败
      # （2026-11-18 那次就是凌晨的「刷新榜单统计」抢先一条提交，导致富化报告白跑）。
      #
      # 富化本身的结果早已写进 D1（真源），仓库里这份 tools-field-report.json
      # 只是后台看板用的派生快照，所以重试即可、不必让 job 失败。
      - name: 提交富化结果
        id: commit
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          git add content/tools-field-report.json
          if git diff --cached --quiet; then
            echo "::notice::本次没有产生变化"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(tools): 富化已确认候选（后台）"

          REF="${GITHUB_REF_NAME:-main}"
          for i in 1 2 3; do
            if git push origin "HEAD:${REF}"; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "::notice::富化完成，请到后台查看字段完整度后再选择发榜"
              exit 0
            fi
            echo "::warning::push 被拒（第 ${i} 次），同步远端后重试"
            git fetch --quiet origin "${REF}"
            if ! GIT_EDITOR=true git rebase "origin/${REF}"; then
              # 报告是脚本从 D1 全量重算的派生文件，冲突时保留本次这份
              # （rebase 过程中 --theirs 指的是被重放的本地提交）
              git checkout --theirs -- content/tools-field-report.json || true
              git add content/tools-field-report.json
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((i * 5))
          done

          # 连续 3 次被拒说明不是普通竞态（权限/token/保护分支），要人看一眼；
          # 但富化数据在 D1 里，不影响条目，所以只报 warning 让后续步骤照常走。
          echo "::warning::连续 3 次推送失败，本次报告未入仓；D1 里的富化结果已写入，下次任务会重新生成这份报告"
          echo "changed=false" >> "$GITHUB_OUTPUT"

      # 预览页是构建期从 D1 导出工作区条目生成的（/preview/{domain}），
      # 不重建的话富化完点「工具名」看到的还是上一版数据。
      # 富化提交只改 content/tools-field-report.json，不在 deploy-site 的 paths 里，
      # 不会自动触发，必须显式 dispatch。
      #
      # refresh 批次（线上条目重采集）不在这里构建：整站一次 20 分钟，而多数更新
      # 根本没人看预览，自动构建纯属烧机时。需要看预览时，由后台「更新待审核」
      # 里的「刷新预览页」按钮按需 dispatch（POST /api/admin/tools/refresh-preview），
      # 按钮上带构建状态，重复点击不会掐掉正在跑的构建。
      # 新条目（kind=new）保持自动构建：那条路是「富化完就要人工审核发榜」。
      - name: 触发站点构建（刷新预览页）
        if: inputs.kind != 'refresh'
        env:
          BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-site.yml/dispatches" \
            -d '{"ref":"main"}' | head -c 400
          echo
          echo "::notice::已请求 Deploy Site，整站构建约 20 分钟，之后预览页即为本次富化的数据"