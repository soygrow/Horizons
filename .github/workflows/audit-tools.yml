name: Audit Listed Tools

# 后台「重判存量」按钮的落点，也是发布预览里「下榜清单」的数据来源。
#
# 为什么需要它：
#   榜单只在发布时新增条目，从不重新判定已在榜上的老条目。站点挂掉、
#   流量跌到 1000 以下的条目会永久留在榜上，而构建时的 tierOf 又会静默
#   把它们过滤掉——后台看不到原因，线上却凭空少一条。
#
# 本工作流只重判、只产出清单（content/tools-audit.json），
# **不删除** content/aitools.json 里的任何条目。真正的下架由发布环节决定。

on:
  workflow_dispatch:
    inputs:
      traffic:
        description: "刷新 Similarweb 流量（0=只用现有数据，$0）"
        required: false
        default: "1"
      probe:
        description: "做 HTTP 存活探测（约 5 分钟）"
        required: false
        default: "1"
      job_id:
        description: "后台任务 ID（仅回显，便于对日志）"
        required: false
        default: ""

concurrency:
  group: audit-tools
  queue: max

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      # fetch-depth: 0 —— 审计报告的推送被拒时要 rebase 到远端最新提交，
      # shallow clone 缺共同祖先会直接 rebase 失败。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 重判已上榜条目
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          # 审计报告与统计快照写库（后台只读库）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.traffic }}" = "1" ]; then ARGS="$ARGS --traffic"; fi
          if [ "${{ inputs.probe }}" = "1" ]; then ARGS="$ARGS --probe"; fi
          pnpm tsx scripts/admin/audit-existing.ts $ARGS

      - name: 提交审计结果
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          git add content/tools-audit.json content/tools-stats.json
          if git diff --cached --quiet; then
            echo "::notice::本次没有产生变化"
            exit 0
          fi
          git commit -m "chore(tools): 重判已上榜条目（后台）"

          # 重判要探活几十条，期间别的 workflow / 人工推送都可能推进 main。
          # 报告是从 D1 重算的派生文件，rebase 重试即可，不该在最后一步整步失败。
          REF="${GITHUB_REF_NAME:-main}"
          pushed=0
          for i in 1 2 3; do
            if git push origin "HEAD:${REF}"; then
              pushed=1
              break
            fi
            echo "::warning::push 被拒（第 ${i} 次），同步远端后重试"
            git fetch --quiet origin "${REF}"
            if ! GIT_EDITOR=true git rebase "origin/${REF}"; then
              git checkout --theirs -- content/tools-audit.json content/tools-stats.json || true
              git add content/tools-audit.json content/tools-stats.json
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep $((i * 5))
          done
          if [ "$pushed" = "0" ]; then
            echo "::warning::连续 3 次推送失败，审计报告未入仓；重判结果在 D1 里，后台仍可查看"
          fi
          echo "::notice::重判完成，请回后台查看下榜清单再决定是否发布"