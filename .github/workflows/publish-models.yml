name: Publish Models

# 模型榜的唯一真源是 D1。采集（fetch-models.yml）采完会直接增量写库，
# 所以这个 workflow 不再「把文件推进库」——它做两件事：
#   1. 校验当前版本快照能不能完整还原（缺 detail 会在这里暴露）；
#   2. 触发站点重建，让前台跟上库里的最新数据。
#
# 日常用法：后台「模型榜 → 采集同步 → 同步到线上」，或直接 Run workflow。
#
# 需要的仓库 Secrets：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID
#   DEPLOY_TOKEN / ADMIN_BOT_TOKEN（PAT，用于 dispatch deploy-site；都没有时退回 GITHUB_TOKEN）

on:
  workflow_dispatch:
    inputs:
      patch:
        description: "兼容旧入口的占位参数，当前无效果（采集即入，不需要再发布一次）"
        type: boolean
        default: true
      strict_d1:
        description: "D1 读取失败时让本次任务失败"
        type: boolean
        default: true

concurrency:
  group: publish-models
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验当前版本能完整还原
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm tsx scripts/admin/hydrate-models.ts --dry

      # 版本没变也要重导（patch 发布不换版本号，快照 key 不变则必须覆盖）
      - name: 导出榜单快照
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm tsx scripts/admin/hydrate-models.ts --upload-snapshot

      - name: 触发站点重建
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-site.yml --ref main -f reason="模型榜：按当前线上版本重建站点"