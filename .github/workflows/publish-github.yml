name: Publish GitHub Board

# 后台「发布」按钮的落点：把候选池合并进 D1 的当前版本，
# 把「谁进榜、谁掉了几名」写回候选池供后台回看，补新条目的中文情报，最后触发站点重建。
#
# 数据只写库：content/github.json 不入库，它是构建缓存，由构建前的 hydrate-github 还原。
#
# 为什么来回 hydrate 两次：
#   1. 发布前 —— 现榜基线要从库里读（旧榜的 README 与中文情报都在 detail 里）；
#   2. 发布后 —— 中文情报富化仍然对文件动手，补完用 --repost 把文件推回库。
# 不这样做的话，富化出来的中文情报会留在工作区里没人接。
#
# 这是整条链路里**唯一**会改正式榜的 workflow —— 必须由人点按钮触发。
on:
  workflow_dispatch:
    inputs:
      incoming:
        description: "本次预计收录的候选数（仅回显）"
        required: false
        default: ""
      expected_significant:
        description: "发布前预览到的显著变动数（仅回显，用于对账）"
        required: false
        default: ""
      patch:
        description: "1 = 增量（默认）：只改写变动的行；0 = 全量：新建版本快照（约 2.3 万行写入）"
        required: false
        default: "1"

concurrency:
  group: publish-github
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # 合并本身很快，时间主要花在两次 hydrate（各 1500 条）和给新条目补中文情报上
    timeout-minutes: 240
    permissions:
      contents: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 从库还原现榜（发布基线）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm exec tsx scripts/admin/hydrate-github.ts

      - name: 合并候选池并输出位次变化
        id: merge
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          # 默认增量；只有显式传 patch=0 才做完整发布
          ARGS=""
          if [ "${{ inputs.patch }}" = "0" ]; then ARGS="--full"; fi
          out=$(pnpm exec tsx scripts/admin/publish-github.ts ${ARGS})
          echo "$out"
          summary=$(echo "$out" | grep '##GH_PUBLISH_RESULT##' | tail -1)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"

      - name: 写入步骤摘要
        run: |
          {
            echo "## 本次发布"
            echo ""
            echo "预计显著变动：${{ inputs.expected_significant }}"
            echo ""
            echo '```json'
            echo '${{ steps.merge.outputs.summary }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 把刚发布的结果还原成文件，供下面两步对文件动手（富化 + 统计）
      #
      # 必须 --no-snapshot 直读 D1：R2 快照是**上一次**构建导出的，
      # 刚写进去的 128 行新数据它还没有。以前这里默认优先快照，文件就被
      # 还原成发布前的样子，后面 --repost 再原样推回库 —— 等于把这次
      # 发布悄悄回滚了，日志还显示「更新 128 行」，查不出问题。
      - name: 还原发布结果到文件（直读 D1，不吃过期快照）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm exec tsx scripts/admin/hydrate-github.ts --no-snapshot

      # 新进榜的条目没有中文情报（采集阶段为了控制候选池体积没有生成），
      # 这里补上，否则详情页是空模板。
      #
      # 只在新增 <= 120 条时自动补：日常维护每轮新增几十条，几分钟跑完；
      # 首次把容量扩到 2000 时会一次涌入几百条，硬跑会撞上 4 小时超时，
      # 那种情况先把榜发出去，之后再单独跑 enrich。
      - name: 补中文情报（新增 <= 120 条时自动跑）
        if: always()
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ ! -f .gh-entered.txt ]; then
            echo "::notice::没有新进榜条目，跳过"
            exit 0
          fi
          n=$(grep -c . .gh-entered.txt || true)
          echo "新进榜 ${n} 条"
          if [ "${n}" -eq 0 ]; then
            echo "::notice::没有新进榜条目，跳过"
            exit 0
          fi
          if [ "${n}" -gt 120 ]; then
            echo "::warning::新进榜 ${n} 条超过自动富化上限 120，本次先发布，情报请稍后单独补"
            exit 0
          fi
          names=$(tr '\n' ' ' < .gh-entered.txt)
          echo "::group::生成中文情报"
          pnpm exec tsx scripts/fetch/enrich-github-insight.ts --only ${names} --limit 200 || \
            echo "::warning::中文情报生成部分失败，可稍后重跑"
          echo "::endgroup::"
          echo "::group::判定加工空间"
          pnpm exec tsx scripts/fetch/enrich-github-derivative.ts --only ${names} || \
            echo "::warning::加工空间判定部分失败，可稍后重跑"
          echo "::endgroup::"

      # 富化改的是文件，推回库才算真的补上。
      # 合并步骤已经写过一遍新数据，这一步通常「未变 / 写入 0 行」，属正常。
      - name: 中文情报回写 D1（与库一致时 0 行为正常）
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm exec tsx scripts/admin/publish-github.ts --repost

      - name: 清理临时文件
        if: always()
        run: rm -f .gh-entered.txt

      # 只提交候选池与统计快照：榜单本体在库里，仓库里不该有它
      - name: 提交候选池与统计
        id: commit
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          pnpm exec tsx scripts/admin/board-stats.ts
          git add content/board-stats.json
          # 候选池正常都在；万一被手工清理过，缺文件会让 git add 直接 fatal
          if [ -f content/github-staging.json ]; then git add content/github-staging.json; fi
          if git diff --cached --quiet; then
            echo "::notice::候选池与统计没有变化，未产生提交"
            exit 0
          fi
          git commit -m "chore(github): 发布后同步候选池与统计"
          # 发布要跑几分钟，这期间人工推送或其它 workflow 都可能推进 main；
          # 裸 push 被拒会让整步红叉（数据其实已经发布成功，白报一次错）
          for i in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME:-main}"; then
              exit 0
            fi
            echo "::warning::push 被拒（第 ${i} 次），rebase 后重试"
            git fetch --quiet origin "${GITHUB_REF_NAME:-main}"
            if ! git rebase "origin/${GITHUB_REF_NAME:-main}"; then
              # 只会是候选池/统计文件冲突：本次发布产出的版本为准
              git checkout --theirs -- content/github-staging.json content/board-stats.json 2>/dev/null || true
              git add content/github-staging.json content/board-stats.json 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue
            fi
            sleep 5
          done
          echo "::error::统计与候选池推送失败，远程 main 持续被改动"
          exit 1

      # 把这一版导出成 R2 快照：之后构建读对象存储（0 rows read），不再分页扫 D1。
      # 失败即中断，宁可这次不部署，也不让构建读到落后于库的快照。
      - name: 导出榜单快照
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm exec tsx scripts/admin/hydrate-github.ts --upload-snapshot

      # 榜单在库里，push 不会自己触发部署，必须显式请求一次
      - name: 触发站点构建
        if: success()
        env:
          BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-site.yml/dispatches" \
            -d '{"ref":"main"}' | head -c 400
          echo
          echo "::notice::已请求 Deploy Site（若未开始，请检查 ADMIN_BOT_TOKEN 权限）"