name: Enrich Trends

# 后台「富化选中」按钮的落点：只给候选池里挑中的词补内容。
# 采集阶段已经存下了曲线、趋势分和证据，这里只花 LLM 的钱。
#
# 不触发站点构建——候选池变了，线上榜单没变。
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "要富化的候选 slug，逗号分隔；留空=全部未富化"
        required: false
        default: ""
      job_id:
        description: "后台任务 ID（仅回显，便于对日志）"
        required: false
        default: ""

# 采集、富化、发布、回滚四条流水线都会写 content/trends-staging.json 并 push 同一个分支。
# 分成不同 group 时它们能同时跑：后 push 的会被拒（non-fast-forward），
# 或先跑完的把对方刚写的候选/富化结果覆盖掉。统一到一个 group 强制串行，
# 排队等待远好过丢一批已经花过 LLM 费用的结果。
concurrency:
  group: trends-staging
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # 浅克隆不允许 rebase，push 被抢先时就没法自动重试
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 富化选中词
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SLUGS: ${{ inputs.slugs }}
          JOB_ID: ${{ inputs.job_id }}
          # 富化结果写库（后台只读库）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          args=()
          if [ -n "$SLUGS" ]; then args+=("--slugs=$SLUGS"); fi
          pnpm exec tsx scripts/admin/enrich-trends.ts "${args[@]}" --job-id="$JOB_ID"

      - name: 提交候选池
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          git add content/trends-staging.json
          if git diff --cached --quiet; then
            echo "::notice::候选池没有变化，未产生提交"
            exit 0
          fi
          ready=$(node -e "const d=require('./content/trends-staging.json');console.log(d.items.filter(t=>!t.enrichStatus).length)")
          git commit -m "feat(trends): 富化候选词（已富化 ${ready} 个）"
          # 同 group 已串行，但人工推送或其它 workflow 仍可能抢先；被拒就 rebase 重试一次
          if ! git push; then
            echo "::warning::push 被拒，rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            git push
          fi