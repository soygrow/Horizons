name: Daily Digest

# 每日情报的采集 / 成稿 / 发布。
#
# 为什么不在本地跑：本地到 reddit、bbc 等源不通，采集会静默少收几十条，
# 而这类缺失不报错，只体现为当天头条质量变差。所以三个环节统一在
# GitHub 的机器上执行，后台 /admin → 每日情报 只负责触发与核对。
#
# mode:
#   fetch   —— 只采集，产出 content/digest/raw/<date>.json
#   build   —— 只成稿，产出 content/digest/<date>.json
#   publish —— 成稿后写 D1（同名一期重复发布会被告警挡下）
#   all     —— 依次执行 fetch → build → publish
#
# 需要的仓库 Secrets（仅 publish 需要）：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch=采集 build=成稿 publish=成稿+入库 all=全部"
        type: choice
        options: [all, fetch, build, publish]
        default: all
      date:
        description: "目标日期 YYYY-MM-DD，留空=今天（UTC+8）"
        type: string
        default: ""
      full:
        description: "全量发布（新建版本快照）；不勾选=增量，只替换本期名次"
        type: boolean
        default: false

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 计算期号
        id: issue
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      # 一律走 pnpm exec tsx 直调，不经 pnpm run —— 脚本后的 --date 会被
      # pnpm 当成自己的参数处理掉，直调才能保证透传。
      - name: 采集
        if: inputs.mode == 'all' || inputs.mode == 'fetch'
        run: pnpm exec tsx scripts/fetch/daily/run.ts --date ${{ steps.issue.outputs.date }}

      - name: 成稿
        if: inputs.mode == 'all' || inputs.mode == 'build' || inputs.mode == 'publish'
        run: pnpm exec tsx scripts/fetch/daily/build.ts --date=${{ steps.issue.outputs.date }}

      - name: 写入 D1
        if: inputs.mode == 'all' || inputs.mode == 'publish'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          FLAGS="--date ${{ steps.issue.outputs.date }}"
          if [ "${{ inputs.full }}" = "true" ]; then FLAGS="$FLAGS --full"; fi
          pnpm tsx scripts/admin/publish-digest.ts $FLAGS

      # 采集与成稿的产物必须提交，否则 /daily/[date] 读不到这一期。
      # 用 git -c 传身份，不动仓库级 git config。
      - name: 提交产物
        run: |
          git add content/digest
          if git diff --staged --quiet; then
            echo "没有产物变更"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(digest): ${{ steps.issue.outputs.date }} 情报"
          git push