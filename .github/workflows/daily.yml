name: Daily Digest

# 每日情报的采集 / 成稿 / 发布。
#
# 为什么不在本地跑：本地到 reddit、bbc 等源不通，采集会静默少收几十条，
# 而这类缺失不报错，只体现为当天头条质量变差。所以三个环节统一在
# GitHub 的机器上执行，后台 /admin → 每日情报 只负责触发与核对。
#
# 触发：
#   - 定时：每天 23:30 UTC = 次日 07:30（UTC+8），对应页面上「每天 07:30 更新」
#   - 手动：后台按钮 / Actions 页，可选 mode 与日期
#
# mode:
#   fetch   —— 只采集，产出 content/digest/raw/<date>.json
#   build   —— 只成稿，产出 content/digest/<date>.json（仅当次 runner 内有效）
#   compose —— 采集 + 成稿 + 落库（生成一期草稿，后台「生成」用）
#   publish —— 只把库里这一期发到榜单（不重新采集/成稿，预览期改过的文案原样进榜）
#   all     —— 依次执行 fetch → build → 落库 → 发榜（定时任务走这条）
#
# 后台的流程是「生成 → 预览 → 发布」三步：
#   1. compose 把整期写进 digest_issues，站点构建后 /daily/<date> 就能看到；
#   2. 预览期可以在后台改几句话，改的也是库里这份 payload；
#   3. publish 只建名次（--from-d1），改过的文案不会被重新成稿冲掉。
#
# 情报的唯一真源是 D1 的 digest_issues：期文件不入库，构建前由
# scripts/admin/hydrate-digest.ts 还原。仓库只留 raw/（采集原文）与
# state/（去重状态），它们不是页面数据。
#
# 需要的仓库 Secrets（compose / publish / all 需要）：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID

# 运行记录的标题：REST 的「列 runs」不返回 inputs，后台只能从这里认期号和模式。
# 定时触发没有 inputs，显示成「今天」，后端按 run 开始时刻的 UTC+8 日期补算。
run-name: 情报 ${{ inputs.mode || 'all' }} ${{ inputs.date || '今天' }}

on:
  schedule:
    # 23:30 UTC = 07:30 Asia/Shanghai（次日）。GitHub 的 cron 只有 UTC。
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch=只采集 build=只成稿 compose=生成草稿 publish=发布本期 all=全流程"
        type: choice
        options: [all, fetch, build, compose, publish]
        default: all
      date:
        description: "目标日期 YYYY-MM-DD，留空=今天（UTC+8）"
        type: string
        default: ""
      full:
        description: "全量发布（新建版本快照）；不勾选=增量，只替换本期名次"
        type: boolean
        default: false

concurrency:
  group: daily-digest
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    # 采集 20+ 个源、抓正文，偶尔碰到慢站会拖很久；30 分钟会误判失败
    timeout-minutes: 60
    permissions:
      contents: write
      actions: write
    env:
      # 定时触发时 inputs 为空，原来所有 if: inputs.mode == 'xxx' 全部为假，
      # 结果是「任务成功、什么都没做」。这里统一兜底成 all。
      MODE: ${{ inputs.mode || 'all' }}
      FULL: ${{ inputs.full || 'false' }}

    steps:
      # fetch-depth: 0 —— 推送被拒时要 rebase 到远端最新提交，浅克隆没有共同祖先
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 计算期号
        id: issue
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      # 一律走 pnpm exec tsx 直调，不经 pnpm run —— 脚本后的 --date 会被
      # pnpm 当成自己的参数处理掉，直调才能保证透传。
      # 参数统一用 --date=VALUE：run.ts 只认等号形式，空格形式会被静默忽略，
      # 结果跑的是「今天」，跟页面上选的日期对不上。
      - name: 采集
        if: env.MODE == 'all' || env.MODE == 'fetch' || env.MODE == 'compose'
        run: pnpm exec tsx scripts/fetch/daily/run.ts --date=${{ steps.issue.outputs.date }}

      - name: 成稿
        if: env.MODE == 'all' || env.MODE == 'build' || env.MODE == 'compose'
        run: pnpm exec tsx scripts/fetch/daily/build.ts --date=${{ steps.issue.outputs.date }}

      # 落库：整期 JSON 进 digest_issues，成为这一期的主副本（页面预览读它）。
      # publish 不走这一步 —— 那一期的 payload 已经在库里，重新落库只会把
      # updated_at 刷掉，也把「生成」和「发布」两个动作混成一次。
      - name: 落库
        if: env.MODE == 'all' || env.MODE == 'compose'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          pnpm exec tsx scripts/admin/publish-digest.ts \
            --date ${{ steps.issue.outputs.date }} --issues-only

      # 发榜：只认库里已有的这一期。预览期在后台改过的 summary / why 就在
      # payload 里，所以这里绝不能重新成稿，否则改完发布等于白改。
      - name: 发榜
        if: env.MODE == 'all' || env.MODE == 'publish'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          FLAGS="--date ${{ steps.issue.outputs.date }} --from-d1"
          if [ "$FULL" = "true" ]; then FLAGS="$FLAGS --full"; fi
          pnpm exec tsx scripts/admin/publish-digest.ts $FLAGS

      # 期文件不再提交：情报的唯一真源是 D1 的 digest_issues，构建前由
      # scripts/admin/hydrate-digest.ts 还原成 content/digest/<date>.json。
      # raw/（采集原文）与 state/（去重状态）不是页面数据，仍留档以便复盘。
      #
      # 推送被拒的处理（每轮先 fetch 再变基、冲突以本次产物为准、带抖动退避）
      # 统一在 .github/actions/push-content 里，别再往这里抄一份。
      - name: 提交采集原文
        if: env.MODE == 'all' || env.MODE == 'fetch' || env.MODE == 'compose'
        uses: ./.github/actions/push-content
        with:
          paths: content/digest/raw content/digest/state
          message: "chore(digest): ${{ steps.issue.outputs.date }} 采集原文"

      # 期文件不进仓库，这条链路也不再产生 content/** 提交，push 型 workflow 收不到
      # 触发信号 —— 部署必须显式 dispatch，否则页面永远停在上一次。
      - name: 触发站点构建
        if: env.MODE == 'all' || env.MODE == 'publish' || env.MODE == 'compose'
        env:
          BOT_TOKEN: ${{ secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${BOT_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/deploy-site.yml/dispatches" \
            -d '{"ref":"main"}' | head -c 400
          echo
          echo "::notice::已请求 Deploy Site（若未开始，请检查 ADMIN_BOT_TOKEN 权限）"