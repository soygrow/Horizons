name: Daily Digest

# 每日情报的采集 / 成稿 / 发布。
#
# 为什么不在本地跑：本地到 reddit、bbc 等源不通，采集会静默少收几十条，
# 而这类缺失不报错，只体现为当天头条质量变差。所以三个环节统一在
# GitHub 的机器上执行，后台 /admin → 每日情报 只负责触发与核对。
#
# 触发：
#   - 定时：每天 23:30 UTC = 次日 07:30（UTC+8），对应页面上「每天 07:30 更新」
#   - 手动：后台按钮 / Actions 页，可选 mode 与日期
#
# mode:
#   fetch   —— 只采集，产出 content/digest/raw/<date>.json
#   build   —— 只成稿，产出 content/digest/<date>.json
#   compose —— 采集 + 成稿，但不写 D1（后台「生成本期」用，发布单独一步）
#   publish —— 成稿后写 D1（同名一期重复发布会被告警挡下）
#   all     —— 依次执行 fetch → build → publish
#
# 需要的仓库 Secrets（仅 publish 需要）：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID

on:
  schedule:
    # 23:30 UTC = 07:30 Asia/Shanghai（次日）。GitHub 的 cron 只有 UTC。
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "fetch=采集 build=成稿 compose=采集+成稿 publish=成稿+入库 all=全部"
        type: choice
        options: [all, fetch, build, compose, publish]
        default: all
      date:
        description: "目标日期 YYYY-MM-DD，留空=今天（UTC+8）"
        type: string
        default: ""
      full:
        description: "全量发布（新建版本快照）；不勾选=增量，只替换本期名次"
        type: boolean
        default: false

concurrency:
  group: daily-digest
  queue: max

jobs:
  run:
    runs-on: ubuntu-latest
    # 采集 20+ 个源、抓正文，偶尔碰到慢站会拖很久；30 分钟会误判失败
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      # 定时触发时 inputs 为空，原来所有 if: inputs.mode == 'xxx' 全部为假，
      # 结果是「任务成功、什么都没做」。这里统一兜底成 all。
      MODE: ${{ inputs.mode || 'all' }}
      FULL: ${{ inputs.full || 'false' }}

    steps:
      # fetch-depth: 0 —— 推送被拒时要 rebase 到远端最新提交，浅克隆没有共同祖先
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 计算期号
        id: issue
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$INPUT_DATE" ]; then
            echo "date=$INPUT_DATE" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      # 一律走 pnpm exec tsx 直调，不经 pnpm run —— 脚本后的 --date 会被
      # pnpm 当成自己的参数处理掉，直调才能保证透传。
      # 参数统一用 --date=VALUE：run.ts 只认等号形式，空格形式会被静默忽略，
      # 结果跑的是「今天」，跟页面上选的日期对不上。
      - name: 采集
        if: env.MODE == 'all' || env.MODE == 'fetch' || env.MODE == 'compose'
        run: pnpm exec tsx scripts/fetch/daily/run.ts --date=${{ steps.issue.outputs.date }}

      - name: 成稿
        if: env.MODE == 'all' || env.MODE == 'build' || env.MODE == 'publish' || env.MODE == 'compose'
        run: pnpm exec tsx scripts/fetch/daily/build.ts --date=${{ steps.issue.outputs.date }}

      - name: 写入 D1
        if: env.MODE == 'all' || env.MODE == 'publish'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          FLAGS="--date ${{ steps.issue.outputs.date }}"
          if [ "$FULL" = "true" ]; then FLAGS="$FLAGS --full"; fi
          pnpm exec tsx scripts/admin/publish-digest.ts $FLAGS

      # 采集与成稿的产物必须提交，否则 /daily/[date] 读不到这一期。
      # 用 git -c 传身份，不动仓库级 git config。
      # 推送被拒（其它 workflow 或人工抢先推了 main）就 rebase 重试：
      # 产物是按日期重新生成的派生文件，以本次结果为准。
      - name: 提交产物
        run: |
          git add content/digest
          if git diff --staged --quiet; then
            echo "没有产物变更"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(digest): ${{ steps.issue.outputs.date }} 情报"

          for i in 1 2 3; do
            if git push origin HEAD:"${GITHUB_REF_NAME:-main}"; then
              echo "推送成功"
              exit 0
            fi
            echo "::warning::push 被拒（第 ${i} 次），rebase 后重试"
            if ! git rebase "origin/${GITHUB_REF_NAME:-main}"; then
              git checkout --theirs content/digest >/dev/null 2>&1 || true
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            fi
            sleep 3
          done

          echo "::error::连续三次推送被拒，产物留在 runner 上未入库"
          exit 1