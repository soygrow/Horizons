name: Revert Trends

# 后台「回滚上一版」按钮的落点：把候选池里刷新过的词退回旧内容。
# 纯数据操作，不联网、不调 LLM，通常十几秒跑完。
#
# 与 enrich-trends 共用同一把并发锁：两者都写 content/trends-staging.json，
# 同时跑会互相覆盖（后写的把先写的改动冲掉）。
on:
  workflow_dispatch:
    inputs:
      slugs:
        description: "要回滚的候选 slug，逗号分隔（必填）"
        required: true
        default: ""
      job_id:
        description: "后台任务 ID（仅回显，便于对日志）"
        required: false
        default: ""

# 采集、富化、发布、回滚四条流水线都会写 content/trends-staging.json 并 push 同一个分支。
# 分成不同 group 时它们能同时跑：后 push 的会被拒（non-fast-forward），
# 或先跑完的把对方刚写的候选/富化结果覆盖掉。统一到一个 group 强制串行，
# 排队等待远好过丢一批已经花过 LLM 费用的结果。
concurrency:
  group: trends-staging
  cancel-in-progress: false

jobs:
  revert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # 浅克隆不允许 rebase，push 被抢先时就没法自动重试
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 回滚上一版内容
        env:
          SLUGS: ${{ inputs.slugs }}
          JOB_ID: ${{ inputs.job_id }}
          # 回滚结果写库（后台只读库）
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm exec tsx scripts/admin/revert-trends.ts --slugs="$SLUGS" --job-id="$JOB_ID"

      - name: 提交候选池
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          git add content/trends-staging.json
          if git diff --cached --quiet; then
            echo "::notice::候选池没有变化，未产生提交"
            exit 0
          fi
          git commit -m "fix(trends): 回滚候选词内容到上一版"
          # 同 group 已串行，但人工推送或其它 workflow 仍可能抢先；被拒就 rebase 重试一次
          if ! git push; then
            echo "::warning::push 被拒，rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            git push
          fi