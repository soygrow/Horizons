name: Fetch Trends (staging)

# 后台「拉取新词」按钮的落点。
#
# 只把采集结果写进 content/trends-staging.json 等人工审核，
# **不碰** content/trends.json，所以线上榜单不会有任何变化。
#
# 需要的仓库 Secrets：
#   DEEPSEEK_API_KEY   补全文案、判定准入原则
#   TRENDS_PROXY       选填。Google Trends 对数据中心 IP 限流很凶，
#                      runner 是 Azure 美国机房，不配代理大概率 429。
#                      格式与本地一致："host:port" 或 "direct,host:port"。
on:
  workflow_dispatch:
    inputs:
      budget:
        description: "本轮处理词数上限（10-200）"
        required: false
        default: "80"
      geo:
        description: "地区代码（US / GB / JP …）"
        required: false
        default: "US"
      patient:
        description: "被限流时长时间等待（慢但更容易跑完）"
        type: boolean
        default: true
      job_id:
        description: "后台任务 ID（仅回显，便于对日志）"
        required: false
        default: ""
      slugs:
        description: "定向重采的 slug（逗号分隔，留空=正常发现新词）"
        required: false
        default: ""

# 采集、富化、发布、回滚四条流水线都会写 content/trends-staging.json 并 push 同一个分支。
# 分成不同 group 时它们能同时跑：后 push 的会被拒（non-fast-forward），
# 或先跑完的把对方刚写的候选/富化结果覆盖掉。统一到一个 group 强制串行，
# 排队等待远好过丢一批已经花过 LLM 费用的结果。
concurrency:
  group: trends-staging
  queue: max

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          # 浅克隆不允许 rebase，push 被抢先时就没法自动重试
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 记录后台任务号
        if: inputs.job_id != ''
        run: echo "::notice::后台任务 job_id=${{ inputs.job_id }}"

      # 候选池里的 board 基线快照来自 content/trends.json，而它在 .gitignore 里、
      # CI checkout 下来没有。不先还原的话基线是空的：后台「线上榜单」显示 0 条，
      # 这批候选还会被全算成「新进榜」，发布预览的「谁掉名次」也全失灵。
      - name: 还原榜单基线
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm exec tsx scripts/admin/hydrate-trends.ts

      # 采集写得慢一点：Google Trends 是这里最容易失败的一环，
      # 宁可跑 2 小时也别在中途被 429 打断。
      #
      # 两条路径：
      #   发现新词（默认）→ 只取曲线、趋势分和证据，不花富化 token；
      #   定向重采（传了 slugs）→ 只刷这几个已在榜的词，曲线和内容一起更新，
      #     因为人工点「更新」要的就是内容也跟上，这些词本来就已经通过审核。
      - name: 采集候选词（只写候选池，不碰线上）
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRENDS_PROXY: ${{ secrets.TRENDS_PROXY }}
          TRENDS_DELAY_MIN: "5000"
          TRENDS_DELAY_MAX: "13000"
          LLM_TIMEOUT_MS: "120000"
          # 候选池落 D1（后台只读库）；失败只告警，不阻塞候选池提交
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          if [ -n "${{ inputs.slugs }}" ]; then
            # 定向重采：不传 --no-enrich，曲线和内容一起刷新
            pnpm exec tsx scripts/fetch/trends/run.ts \
              --staging \
              --slugs "${{ inputs.slugs }}" \
              --limit "${{ inputs.budget }}" \
              --geo "${{ inputs.geo }}" \
              ${{ inputs.patient && '--patient' || '' }}
          else
            pnpm exec tsx scripts/fetch/trends/run.ts \
              --staging \
              --no-enrich \
              --limit "${{ inputs.budget }}" \
              --geo "${{ inputs.geo }}" \
              ${{ inputs.patient && '--patient' || '' }}
          fi

      - name: 提交候选池
        run: |
          git config user.name "horizons-bot"
          git config user.email "bot@horizons.tools"
          git add content/trends-staging.json content/trends-skipped.json
          if git diff --cached --quiet; then
            echo "::notice::本轮没有产出候选词，未产生提交"
            exit 0
          fi
          n=$(node -e "const s=require('./content/trends-staging.json');console.log(s.items.length)")
          git commit -m "chore(trends): 采集候选词 ${n} 个（待审核）"
          # 同 group 已串行，但人工推送或其它 workflow 仍可能抢先；被拒就 rebase 重试一次
          if ! git push; then
            echo "::warning::push 被拒，rebase 后重试"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}"
            git push
          fi
          echo "::notice::候选池已更新，共 ${n} 个待审核词"