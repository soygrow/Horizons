name: Fetch Models

# 定向刷新模型榜里的几个模型：从 OpenRouter / models.dev 重新拉这些条目的
# 价格、上下文、能力分，直接增量写 D1，然后触发站点重建。
#
# 为什么采集要放在 CI：两个源都是公网接口，Worker 里跑不了整条采集管线。
#
# 为什么先 hydrate：模型榜的唯一真源是 D1，仓库里没有 content/models.json
# （它是构建缓存）。定向刷新要拿「当前线上榜单」做基线，所以先把它从库里还原出来，
# 采集改完再写回库 —— 读和写都只经过 D1，没有第二份真源。
#
# 为什么最后要 dispatch deploy-site：数据不在仓库里，push 不会触发部署，
# 站点自己也不会知道榜单变了。不发这一下，前台会一直停在上一次的构建。
#
# 需要的仓库 Secrets（写 D1 与触发部署）：
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / D1_DATABASE_ID
#   DEPLOY_TOKEN / ADMIN_BOT_TOKEN（PAT，用于 dispatch deploy-site；都没有时退回 GITHUB_TOKEN）

on:
  workflow_dispatch:
    inputs:
      models:
        description: "要刷新的模型 slug，逗号分隔（一次最多 60 个）"
        required: true
        type: string

concurrency:
  group: fetch-models
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 不再提交文件，但 dispatch deploy-site 需要 token
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 校验入参
        env:
          MODELS: ${{ inputs.models }}
        run: |
          n=$(echo "$MODELS" | tr ',' '\n' | grep -c . || true)
          echo "本次刷新 $n 个：$MODELS"
          if [ "$n" -eq 0 ]; then
            echo "::error::没有要刷新的 slug"
            exit 1
          fi
          if [ "$n" -gt 60 ]; then
            echo "::error::一次最多 60 个，当前 $n 个"
            exit 1
          fi

      - name: 从库还原当前榜单（定向刷新的基线）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm tsx scripts/admin/hydrate-models.ts

      - name: 定向刷新并写 D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          GITHUB_ACTOR: ${{ github.actor }}
          MODELS: ${{ inputs.models }}
        # 不用模板直接拼进命令行：slug 来自后台输入，让它走环境变量而不是 shell 拼接
        run: pnpm tsx scripts/collect/index.mjs --models="$MODELS"

      # 采集结果只进了 D1，工作区应该干净（pending 文件在 content/cache 下，已被忽略）。
      # 如果有别的文件变了，说明有人绕过了「只写库」的口径，直接失败让人看见。
      - name: 确认没有改到仓库文件
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            echo "::error::采集过程改动了仓库文件，模型榜应当只写 D1"
            exit 1
          fi
          echo "工作区干净，数据只写进了 D1"

      # collect 只会 patch 写库（版本号不变），所以每次都要覆盖同版本快照
      - name: 导出榜单快照
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: pnpm tsx scripts/admin/hydrate-models.ts --upload-snapshot

      - name: 触发站点重建
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN || secrets.ADMIN_BOT_TOKEN || secrets.GITHUB_TOKEN }}
          MODELS: ${{ inputs.models }}
        run: |
          gh workflow run deploy-site.yml --ref main \
            -f reason="模型榜定向刷新：${MODELS}"